<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EstoquePro</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#090d16" />
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --card-border: #1e293b;
      --input: #0b101d;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 85px; }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    
    /* Topo */
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 20px; border-bottom: 1px solid var(--card-border); margin-bottom: 20px; }
    .brand h1 { font-size: 22px; font-weight: 800; background: linear-gradient(90deg, #60a5fa, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .btn-export { background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; padding: 10px 14px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }

    /* Cards de Resumo */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px 12px; position: relative; overflow: hidden; }
    .stat-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 3px; }
    .stat-card.blue::before { background: var(--primary); }
    .stat-card.purple::before { background: #8b5cf6; }
    .stat-card.green::before { background: var(--success); }
    .stat-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-value { font-size: 20px; font-weight: 800; margin-top: 6px; color: #fff; }
    .stat-value.money { font-size: 16px; color: #34d399; }

    /* Abas */
    .tabs { display: flex; gap: 8px; background: var(--card); padding: 6px; border-radius: 14px; border: 1px solid var(--card-border); margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--muted); font-size: 13px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 2px 10px rgba(59, 130, 246, 0.35); }

    /* Formulário */
    .box { background: var(--card); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; margin-bottom: 20px; }
    .box-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #e2e8f0; display: flex; align-items: center; gap: 6px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .full { grid-column: span 2; }
    input { width: 100%; background: var(--input); border: 1px solid var(--card-border); color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 14px; outline: none; transition: 0.2s; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    .btn-primary { width: 100%; background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border: none; padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35); }

    /* Busca */
    .search-bar { margin-bottom: 14px; }

    /* Lista de Produtos */
    .product-list { display: flex; flex-direction: column; gap: 10px; }
    .product-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .product-card.low-stock { border-color: rgba(245, 158, 11, 0.5); background: linear-gradient(145deg, #131b2e, #1c1917); }
    .prod-info h3 { font-size: 15px; font-weight: 700; color: #fff; }
    .prod-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 12px; color: var(--muted); }
    .badge { padding: 3px 8px; border-radius: 8px; font-weight: 700; font-size: 11px; background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .badge.low { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge.zero { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    /* Ações */
    .actions { display: flex; align-items: center; gap: 6px; }
    .btn-sell { background: var(--success); color: #fff; border: none; padding: 9px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-sell:active { transform: scale(0.96); }
    .btn-plus { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 9px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-del { background: rgba(239, 68, 68, 0.12); color: #f87171; border: none; padding: 9px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }

    /* Relatório Mensal */
    .report-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--card-border); font-size: 13px; }
    .report-row:last-child { border-bottom: none; }
    .hidden { display: none; }
    .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 10px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>EstoquePro</h1>
        <p>Gestão de Vendas e Inventário</p>
      </div>
      <button class="btn-export" onclick="exportarRelatorio()">📥 Relatório CSV</button>
    </header>

    <!-- Resumo -->
    <div class="stats-grid">
      <div class="stat-card blue">
        <div class="stat-label">Em Estoque</div>
        <div class="stat-value" id="total-estoque">0</div>
      </div>
      <div class="stat-card purple">
        <div class="stat-label">Vendidos (Mês)</div>
        <div class="stat-value" id="total-vendidos">0</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">Faturamento</div>
        <div class="stat-value money" id="total-faturamento">R$ 0,00</div>
      </div>
    </div>

    <!-- Navegação por Abas -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-estoque" onclick="mudarAba('estoque')">📦 Meu Estoque</button>
      <button class="tab-btn" id="tab-relatorio" onclick="mudarAba('relatorio')">📊 Relatório do Mês</button>
    </div>

    <!-- ABA 1: ESTOQUE -->
    <div id="view-estoque">
      <div class="box">
        <div class="box-title">✨ Cadastrar Novo Produto</div>
        <form id="form-produto" class="form-grid">
          <input type="text" id="nome" class="full" placeholder="Nome do produto (ex: Camiseta Preta)" required />
          <input type="number" id="preco" placeholder="Preço (R$)" step="0.01" min="0" required />
          <input type="number" id="qtd" placeholder="Qtd inicial" min="1" required />
          <button type="submit" class="btn-primary full">+ Adicionar Produto</button>
        </form>
      </div>

      <div class="search-bar">
        <input type="text" id="busca" placeholder="🔍 Buscar produto no estoque..." oninput="renderizar()" />
      </div>

      <div id="lista-produtos" class="product-list"></div>
    </div>

    <!-- ABA 2: RELATÓRIO MENSAL -->
    <div id="view-relatorio" class="hidden">
      <div class="box">
        <div class="box-title" id="titulo-mes">📅 Resumo de Vendas do Mês</div>
        <div id="lista-relatorio"></div>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let produtos = JSON.parse(localStorage.getItem('estoque_produtos')) || [];
    let vendas = JSON.parse(localStorage.getItem('estoque_vendas')) || [];

    function salvarDados() {
      localStorage.setItem('estoque_produtos', JSON.stringify(produtos));
      localStorage.setItem('estoque_vendas', JSON.stringify(vendas));
      renderizar();
    }

    function mudarAba(aba) {
      document.getElementById('view-estoque').classList.toggle('hidden', aba !== 'estoque');
      document.getElementById('view-relatorio').classList.toggle('hidden', aba !== 'relatorio');
      document.getElementById('tab-estoque').classList.toggle('active', aba === 'estoque');
      document.getElementById('tab-relatorio').classList.toggle('active', aba === 'relatorio');
      renderizar();
    }

    document.getElementById('form-produto').addEventListener('submit', (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const preco = parseFloat(document.getElementById('preco').value);
      const qtd = parseInt(document.getElementById('qtd').value);
      produtos.unshift({ id: Date.now(), nome, preco, qtd });
      e.target.reset();
      salvarDados();
    });

    function registrarVenda(id) {
      const prod = produtos.find(p => p.id === id);
      if (prod && prod.qtd > 0) {
        prod.qtd -= 1;
        vendas.unshift({
          produto: prod.nome,
          valor: prod.preco,
          data: new Date().toISOString()
        });
        salvarDados();
      } else {
        alert('Produto esgotado no estoque!');
      }
    }

    function adicionarEstoque(id) {
      const prod = produtos.find(p => p.id === id);
      if (prod) {
        prod.qtd += 1;
        salvarDados();
