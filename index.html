<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Estoque Pro</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10">
  <div class="max-w-3xl mx-auto p-4">
    <header class="flex justify-between items-center py-4 border-b border-slate-800 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-blue-400">EstoquePro</h1>
        <p class="text-xs text-slate-400">Controle de Produtos e Vendas</p>
      </div>
      <button onclick="exportarRelatorio()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow">
        Baixar Relatório
      </button>
    </header>

    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <p class="text-xs text-slate-400">Em Estoque</p>
        <p id="total-estoque" class="text-2xl font-bold text-white mt-1">0</p>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <p class="text-xs text-slate-400">Vendidos (Mês)</p>
        <p id="total-vendidos" class="text-2xl font-bold text-blue-400 mt-1">0</p>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <p class="text-xs text-slate-400">Faturamento</p>
        <p id="total-faturamento" class="text-xl font-bold text-emerald-400 mt-1">R$ 0,00</p>
      </div>
    </div>

    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6">
      <h2 class="text-sm font-semibold text-slate-300 mb-3">Novo Produto</h2>
      <form id="form-produto" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <input type="text" id="nome" placeholder="Nome do produto" required class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 sm:col-span-2" />
        <input type="number" id="preco" placeholder="Preço (R$)" step="0.01" required class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
        <input type="number" id="qtd" placeholder="Qtd" required class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded-lg text-sm sm:col-span-4 transition">
          + Adicionar ao Estoque
        </button>
      </form>
    </div>

    <h2 class="text-sm font-semibold text-slate-300 mb-3">Produtos Cadastrados</h2>
    <div id="lista-produtos" class="space-y-3"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let produtos = JSON.parse(localStorage.getItem('estoque_produtos')) || [];
    let vendas = JSON.parse(localStorage.getItem('estoque_vendas')) || [];

    function salvarDados() {
      localStorage.setItem('estoque_produtos', JSON.stringify(produtos));
      localStorage.setItem('estoque_vendas', JSON.stringify(vendas));
      renderizar();
    }

    document.getElementById('form-produto').addEventListener('submit', (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const preco = parseFloat(document.getElementById('preco').value);
      const qtd = parseInt(document.getElementById('qtd').value);
      produtos.push({ id: Date.now(), nome, preco, qtd });
      e.target.reset();
      salvarDados();
    });

    function registrarVenda(id) {
      const prod = produtos.find(p => p.id === id);
      if (prod && prod.qtd > 0) {
        prod.qtd -= 1;
        vendas.push({
          produto: prod.nome,
          valor: prod.preco,
          data: new Date().toISOString()
        });
        salvarDados();
      } else {
        alert('Produto sem estoque!');
      }
    }

    function adicionarEstoque(id) {
      const prod = produtos.find(p => p.id === id);
      if (prod) {
        prod.qtd += 1;
        salvarDados();
      }
    }

    function removerProduto(id) {
      produtos = produtos.filter(p => p.id !== id);
      salvarDados();
    }

    function renderizar() {
      const mesAtual = new Date().getMonth();
      const anoAtual = new Date().getFullYear();

      const vendasMes = vendas.filter(v => {
        const d = new Date(v.data);
        return d.getMonth() === mesAtual && d.getFullYear() === anoAtual;
      });

      const totalEstoque = produtos.reduce((acc, p) => acc + p.qtd, 0);
      const totalVendidos = vendasMes.length;
      const faturamento = vendasMes.reduce((acc, v) => acc + v.valor, 0);

      document.getElementById('total-estoque').innerText = totalEstoque;
      document.getElementById('total-vendidos').innerText = totalVendidos;
      document.getElementById('total-faturamento').innerText = faturamento.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

      const lista = document.getElementById('lista-produtos');
      lista.innerHTML = '';

      if (produtos.length === 0) {
        lista.innerHTML = '<p class="text-center text-slate-500 text-sm py-6">Nenhum produto cadastrado ainda.</p>';
        return;
      }

      produtos.forEach(p => {
        const alerta = p.qtd <= 3 ? 'border-amber-500/50' : 'border-slate-700';
        lista.innerHTML += `
          <div class="bg-slate-800 p-4 rounded-xl border ${alerta} flex justify-between items-center">
            <div>
              <h3 class="font-semibold text-white">${p.nome}</h3>
              <p class="text-xs text-slate-400">R$ ${p.preco.toFixed(2)} • <span class="${p.qtd <= 3 ? 'text-amber-400 font-bold' : ''}">Restam: ${p.qtd}</span></p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="registrarVenda(${p.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-lg">
                Vender 1
              </button>
              <button onclick="adicionarEstoque(${p.id})" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-2.5 py-2 rounded-lg">
                +1
              </button>
              <button onclick="removerProduto(${p.id})" class="text-rose-400 hover:text-rose-300 text-xs px-2 py-2">
                ✕
              </button>
            </div>
          </div>
        `;
      });
    }

    function exportarRelatorio() {
      const mesAtual = new Date().getMonth();
      const vendasMes = vendas.filter(v => new Date(v.data).getMonth() === mesAtual);
      let csv = "Produto,Valor (R$),Data\n";
      vendasMes.forEach(v => {
        csv += `"${v.produto}",${v.valor.toFixed(2)},"${new Date(v.data).toLocaleDateString('pt-BR')}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `relatorio-vendas-mes-${mesAtual + 1}.csv`;
      link.click();
    }

    renderizar();
  </script>
</body>
</html>
